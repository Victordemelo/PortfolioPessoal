services:
  site:
    build: .
    restart: unless-stopped
    environment:
      # Sempre ":80": o Caddy só serve HTTP interno. Em produção o HTTPS é do
      # Nginx + Certbot do servidor (ver docs/ARQUITETURA.md)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Só em localhost: publicar em 0.0.0.0 faria o Docker furar o firewall
      # do host. Em produção quem alcança esta porta é o Nginx do servidor.
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Endurecimento: se alguém achar uma falha no Caddy, encontra um container
    # sem onde gravar (fora de /data, /config e /tmp), sem permissões especiais
    # do Linux (só a de abrir a porta 80) e sem como ganhar privilégio novo.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
