services:
  site:
    build: .
    restart: unless-stopped
    environment:
      # Sempre ":80": o Caddy só serve HTTP interno. Em produção o HTTPS é do
      # Nginx + Certbot do servidor (ver docs/ARQUITETURA.md)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Só em localhost: publicar em 0.0.0.0 faria o Docker furar o firewall
      # do host. Em produção quem alcança esta porta é o Nginx do servidor.
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
