    <script>
      // Aplica o tema antes do primeiro paint para não piscar
      try {
        const t = localStorage.getItem('tema')
        if (t === 'claro' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('claro')
        }
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
