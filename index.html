<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- título, descrição, canônico, Open Graph e JSON-LD: gerados por seo.ts no build -->
    <!--seo:head--><!--/seo:head-->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f11" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />
    <style>
      /* Antes de qualquer CSS externo: fundo certo (sem piscar branco) e, com JS,
         esconde o conteúdo em HTML puro que o seo.ts gera para buscadores; o
         React desenha o site em seguida */
      html { background: #0e0f11; }
      html.claro { background: #f5f3ee; }
      html.js .conteudo-estatico { display: none; }
    </style>
    <script>
      document.documentElement.classList.add('js')
      // Aplica o tema antes do primeiro paint para não piscar
      try {
        const t = localStorage.getItem('tema')
        if (t === 'claro' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('claro')
        }
      } catch {}
    </script>
  </head>
  <body>
    <!-- o conteúdo em HTML puro (para buscadores e para quem está sem JS) é gerado
         por seo.ts; o React substitui ao iniciar -->
    <div id="root"><!--seo:corpo--><!--/seo:corpo--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
